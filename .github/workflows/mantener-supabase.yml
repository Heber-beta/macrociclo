name: Mantener Supabase activo

# Supabase pausa los proyectos gratuitos sin actividad. Esta tarea hace una
# consulta pequeña cada 2 días para que el proyecto siga activo.
on:
  schedule:
    - cron: "17 12 */2 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar la API de Supabase
        run: |
          URL="https://bquxfhbuspaykcpacefa.supabase.co"
          KEY=$(curl -s https://heber-beta.github.io/macrociclo/ | grep -o '"supabaseKey": "[^"]*' | cut -d'"' -f4)
          code=$(curl -s -o /dev/null -w "%{http_code}" "$URL/rest/v1/macros?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "Respuesta de Supabase: $code"
          [ "$code" -lt 500 ]
